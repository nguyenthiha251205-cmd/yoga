{% extends "base.html" %}
{% load static %}

{% block title %}Đăng Ký Thành Viên | SoraYoga Hóc Môn{% endblock %}

{% block extra_head %}
    <script>
        window.siteConfig = {
            logoUrl: "{% static 'images/logo.png' %}",
            homeUrl: "{% url 'home' %}"
        };
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #7C9885;
            --secondary-color: #E8F3E8;
            --accent-color: #A8C4B5;
            --text-dark: #2C3E37;
            --text-light: #5F6F65;
            --bg-light: #F8FBF9;
        }
    }
    @layer base {
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-light);
        }
    }
    @layer components {
        .btn-primary { 
            @apply px-6 py-4 rounded-xl font-bold transition-all shadow-lg hover:shadow-xl active:scale-95 text-center; 
            background-color: #7C9885; 
            color: white; 
        }
        .input-field {
            @apply w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[var(--primary-color)] focus:border-transparent outline-none transition-all bg-white;
        }
    }
    </style>
{% endblock %}

{% block content %}
<div id="header-root"></div>

<main class="pt-32 md:pt-40 pb-20">
    <div class="max-w-7xl mx-auto px-4">
        <div id="register-app-root">
            </div>

        <noscript>
            <div class="prose mx-auto mt-10 p-6 bg-white rounded-2xl shadow-sm text-center">
                <h2 class="text-[var(--primary-color)]">Quy trình đăng ký đơn giản</h2>
                <p>Vui lòng bật JavaScript để tiếp tục đăng ký trực tuyến.</p>
            </div>
        </noscript>
    </div>
</main>

<div id="footer-root"></div>
{% endblock %}

{% block scripts %}
    <script src="{% static 'components/classData.js' %}"></script>
    <script type="text/babel" src="{% static 'components/Header.js' %}"></script>
    <script type="text/babel" src="{% static 'components/Footer.js' %}"></script>
    <script type="text/babel" src="{% static 'js/register-app.js' %}"></script>
{% endblock %}
