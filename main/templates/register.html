{% extends "base.html" %}
{% load static %}
{% block title %}Đăng Ký Thành Viên | SoraYoga Hóc Môn{% endblock %}
{% block extra_head %}
<link rel="icon" href="data:,">
    <script>
        window.siteConfig = {
            logoUrl: "{% static 'images/logo.png' %}",
            homeUrl: "{% url 'home' %}",
            currentUser: "{{ request.user.username|default:'' }}"
        };
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
{% endblock %}
{% block content %}
<div id="header-root"></div>
<main class="pt-44 md:pt-40 pb-20">
    <div class="max-w-7xl mx-auto px-4">
        <div id="register-app-root">
            </div>
        <noscript>
            <div class="prose mx-auto mt-10 p-6 bg-white rounded-2xl shadow-sm text-center">
                <h2 class="text-[var(--primary-color)]">Quy trình đăng ký đơn giản</h2>
                <p>Vui lòng bật JavaScript để tiếp tục đăng ký trực tuyến.</p>
            </div>
        </noscript>
    </div>
</main>
<div id="footer-root"></div>
{% endblock %}
{% block scripts %}
    <script>
        // Lấy dữ liệu đã bao gồm mảng 'times' từ database (view gửi xuống)
        const rawData = {{ class_list_json|safe }};
        
        // Gán vào window.dbClasses để React-app sử dụng
        window.dbClasses = rawData.map(c => ({
            id: c.id.toString(),
            name: c.name,
            branch: c.branch,
            slug: c.slug,
            price: c.price,
            // Quan trọng: lấy mảng times từ database
            times: c.times.length > 0 ? c.times : ["Liên hệ để biết lịch học"]
        }));
    </script>
    <script type="text/babel" src="{% static 'components/Header.js' %}"></script>
    <script type="text/babel" src="{% static 'components/Footer.js' %}"></script>
    <script type="text/babel" src="{% static 'js/register-app.js' %}"></script>
{% endblock %}
