{% extends "base.html" %}
{% load static %}

{% block title %}Blog SoraYoga: Kiến Thức Yoga & Sức Khỏe{% endblock %}

{% block extra_head %}
    <script>
        window.siteConfig = {
            logoUrl: "/static/images/logo.png", 
            homeUrl: "/" 
        };
    </script>
    <meta name="description" content="Blog SoraYoga Hóc Môn: Tổng hợp bài viết chuyên sâu về kỹ thuật Yoga...">
    <link rel="canonical" href="{{ request.build_absolute_uri }}">
    
    <script type="application/ld+json">
    { 
      "@context": "https://schema.org", 
      "@type": "Blog", 
      "name": "Blog SoraYoga" 
    }
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
    // Truyền dữ liệu bài viết từ Django Model sang React
        window.djangoPosts = {{ posts_json|safe|default:"[]" }};
    </script>

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #7C9885;
            --secondary-color: #E8F3E8;
            --accent-color: #A8C4B5;
            --text-dark: #2C3E37;
            --text-light: #5F6F65;
            --bg-light: #F8FBF9;
        }
    }
    @layer base {
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-dark);
            line-height: 1.6;
        }
    }
    @layer components {
            .btn-primary { @apply px-6 py-3 rounded-lg font-medium transition-all; background-color: #7C9885; color: white; }
            .nav-link.active { color: #7C9885; border-bottom: 2px solid #7C9885; }
        }
    </style>
{% endblock %}

{% block content %}
    {% endblock %}

{% block scripts %}
    <script type="text/babel" src="{% static 'components/Header.js' %}"></script>
    <script type="text/babel" src="{% static 'components/BlogContent.js' %}"></script>
    <script type="text/babel" src="{% static 'components/blogData.js' %}"></script>
    <script type="text/babel" src="{% static 'components/Footer.js' %}"></script>
    <script type="text/babel" src="{% static 'js/blog-app.js' %}"></script>
{% endblock %}
