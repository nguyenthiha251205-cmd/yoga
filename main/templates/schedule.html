{% extends "base.html" %}
{% load static %}

{% block title %}Lịch Học Yoga Hàng Tuần - SoraYoga Hóc Môn{% endblock %}

{% block extra_head %}
    <meta name="description" content="Xem lịch tập Yoga chi tiết tại SoraYoga Hóc Môn. Đầy đủ các lớp Hatha, Vinyasa, Yin Yoga buổi sáng và buổi tối cho mọi cấp độ.">
    <link rel="canonical" href="{{ request.build_absolute_uri }}">
    
    <script>
        window.siteConfig = {
            logoUrl: "{% static 'images/logo.png' %}",
            homeUrl: "{% url 'home' %}"
        };
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #7C9885;
            --secondary-color: #E8F3E8;
            --accent-color: #A8C4B5;
            --text-dark: #2C3E37;
            --text-light: #5F6F65;
            --bg-light: #F8FBF9;
        }
    }
    @layer base {
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-light);
        }
    }
    @layer components {
        .schedule-card {
            @apply bg-white p-8 rounded-3xl shadow-sm border border-gray-100 transition-all duration-300 hover:shadow-xl hover:-translate-y-1;
        }
        .time-badge {
            @apply inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-4;
        }
    }
    </style>
{% endblock %}

{% block content %}
<div id="header-root"></div>

<div id="schedule-root"></div>

<div id="footer-root"></div>
{% endblock %}

{% block scripts %}
    <script type="text/babel" src="{% static 'components/classData.js' %}"></script>
    <script type="text/babel" src="{% static 'components/scheduleData.js' %}"></script>
    
    <script type="text/babel" src="{% static 'components/Header.js' %}"></script>
    <script type="text/babel" src="{% static 'components/Footer.js' %}"></script>
    
    <script type="text/babel" src="{% static 'components/ScheduleContent.js' %}"></script>
    
    <script type="text/babel" src="{% static 'js/schedule-app.js' %}"></script>
{% endblock %}
