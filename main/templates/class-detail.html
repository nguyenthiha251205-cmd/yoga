{% extends "base.html" %}
{% load static %}

{% block title %}Chi tiết Lớp Học | SoraYoga Hóc Môn{% endblock %}

{% block extra_head %}
    <meta name="description" content="Chi tiết Lớp Yoga tại SoraYoga Hóc Môn. Xem thông tin chi phí, lịch học và đăng ký ngay lớp tập thử miễn phí cho người mới bắt đầu!">
    <link rel="canonical" href="{{ request.build_absolute_uri }}">
    
    <script>
        window.siteConfig = {
            logoUrl: "{% static 'images/logo.png' %}",
            homeUrl: "{% url 'home' %}"
        };
    </script>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #7C9885;
            --secondary-color: #E8F3E8;
            --accent-color: #A8C4B5;
            --text-dark: #2C3E37;
            --text-light: #5F6F65;
            --bg-light: #F8FBF9;
        }
    }
    @layer base {
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-light);
        }
    }
    @layer components {
        .btn-primary {
            @apply bg-[var(--primary-color)] text-white px-6 py-2 rounded-lg font-medium transition-all duration-300 hover:opacity-90;
        }
        .class-card {
            @apply bg-white p-8 rounded-3xl shadow-sm border border-gray-100 transition-all duration-300 hover:shadow-xl;
        }
    }
    </style>
{% endblock %}

{% block content %}
<div id="header-root"></div>

<div id="class-detail-root"></div>

<div id="footer-root"></div>
{% endblock %}

{% block scripts %}
    <script type="text/babel" src="{% static 'components/classData.js' %}"></script>
    <script type="text/babel" src="{% static 'components/scheduleData.js' %}"></script>
    
    <script type="text/babel" src="{% static 'components/Header.js' %}"></script>
    <script type="text/babel" src="{% static 'components/Footer.js' %}"></script>
    <script type="text/babel" src="{% static 'components/ClassDetailContent.js' %}"></script>
    
    <script type="text/babel" src="{% static 'js/class-detail-app.js' %}"></script>
{% endblock %}
