{% extends "base.html" %}
{% load static %}
{% block title %}Hệ thống chi nhánh SoraYoga{% endblock %}
{% block extra_head %}
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<style>
    #map-container {
        height: 550px !important;
        width: 100%;
        border-radius: 1.5rem;
        border: 4px solid white;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #7C9885; border-radius: 10px; }
    /* Styling cho thanh chọn bán kính */
    .radius-slider {
        -webkit-appearance: none;
        width: 100%;
        height: 6px;
        background: #e5e7eb;
        border-radius: 5px;
        outline: none;
    }
    .radius-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        background: #7C9885;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid white;
    }
</style>
{% endblock %}
{% block content %}
<div class="container mx-auto py-8 px-4">
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-[#2C3E37]">Tìm kiếm chi nhánh</h1>
        <p class="text-gray-500">Khám phá không gian tập luyện Yoga chuyên nghiệp gần bạn nhất.</p>
    </div>
    <div id="branch-finder-root"></div>
</div>
<script type="text/babel">
    window.allBranches = {{ branches_json|safe }};
    function BranchFinder() {
        const initialData = window.allBranches || [];
        const [userLoc, setUserLoc] = React.useState(null);
        const [sortedBranches, setSortedBranches] = React.useState(initialData);
        const [searchText, setSearchText] = React.useState("");
        const [radius, setRadius] = React.useState(20); 
        const [nearest, setNearest] = React.useState(null);
        const mapRef = React.useRef(null);
        const routingRef = React.useRef(null);
        const markersLayerRef = React.useRef(L.layerGroup());
        const userMarkerRef = React.useRef(null);
        const getDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        };
        const filterData = (text, currentRadius, location, isScanning = false) => {
            let filtered = initialData.map(b => {
                const d = location ? getDistance(location.lat, location.lng, b.lat, b.lng) : null;
                return { ...b, dist: d };
            });
            filtered = filtered.filter(b => {
                const matchesSearch = b.name.toLowerCase().includes(text.toLowerCase()) || 
                                     b.address.toLowerCase().includes(text.toLowerCase());
                // Nếu đang nhấn nút Quét và có vị trí, lọc chặt theo bán kính
                // Nếu chỉ đang gõ tìm kiếm thì hiện theo text
                const matchesRadius = (isScanning && location) ? (b.dist <= currentRadius) : true;
                return matchesSearch && matchesRadius;
            });
            if (location) {
                filtered.sort((a, b) => (a.dist || 0) - (b.dist || 0));
            }
            setSortedBranches(filtered);
            if (location && filtered.length > 0) setNearest(filtered[0]);
            else setNearest(null);
        };
        React.useEffect(() => {
            if (!mapRef.current) {
                mapRef.current = L.map('map-container').setView([10.7769, 106.7009], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(mapRef.current);
                markersLayerRef.current.addTo(mapRef.current);
            }
            markersLayerRef.current.clearLayers();
            sortedBranches.forEach(branch => {
                if (branch.lat && branch.lng) {
                    L.marker([branch.lat, branch.lng])
                        .addTo(markersLayerRef.current)
                        .bindPopup(`<b>${branch.name}</b><br>${branch.address}`);
                }
            });
        }, [sortedBranches]);
        const handleFindMe = () => {
            navigator.geolocation.getCurrentPosition((pos) => {
                const uLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                setUserLoc(uLoc);
                mapRef.current.flyTo([uLoc.lat, uLoc.lng], 13);
                if (userMarkerRef.current) mapRef.current.removeLayer(userMarkerRef.current);
                userMarkerRef.current = L.marker([uLoc.lat, uLoc.lng], {
                    icon: L.divIcon({ html: '📍', className: 'text-2xl', iconSize: [24, 24] })
                }).addTo(mapRef.current).bindPopup("Vị trí của bạn").openPopup();
                filterData(searchText, radius, uLoc, false);
            });
        };
        // Hàm xử lý khi nhấn nút Quét
        const handleScan = () => {
            if (!userLoc) {
                alert("Vui lòng nhấn 'Xác định vị trí' trước để có tâm điểm quét.");
                return;
            }
            filterData(searchText, radius, userLoc, true);
        };
        const showRoute = (branch) => {
            if (!userLoc) { alert("Vui lòng nhấn 'Xác định vị trí' trước"); return; }
            if (routingRef.current) mapRef.current.removeControl(routingRef.current);
            routingRef.current = L.Routing.control({
                waypoints: [L.latLng(userLoc.lat, userLoc.lng), L.latLng(branch.lat, branch.lng)],
                lineOptions: { styles: [{ color: '#7C9885', weight: 5 }] },
                addWaypoints: false,
                createMarker: () => null
            }).addTo(mapRef.current);
        };
        return (
            <div className="flex flex-col lg:flex-row gap-6">
                <div className="lg:w-1/3 space-y-4">
                    <input
                        type="text"
                        placeholder="🔎 Tìm chi nhánh..."
                        value={searchText}
                        onChange={(e) => {
                            setSearchText(e.target.value);
                            filterData(e.target.value, radius, userLoc, false);
                        }}
                        className="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#7C9885] outline-none"
                    />
                    <button onClick={handleFindMe} className="w-full bg-[#7C9885] text-white p-3 rounded-xl font-bold hover:bg-[#5F6F65] transition-colors">
                        📍 1. Xác định vị trí của tôi
                    </button>
                    <div className="p-4 bg-white border-2 border-dashed border-gray-200 rounded-xl space-y-3">
                        <div className="flex justify-between items-center">
                            <span className="text-sm font-bold text-gray-700">Phạm vi tìm kiếm:</span>
                            <span className="text-sm font-bold text-[#7C9885]">{radius} km</span>
                        </div>
                        <input 
                            type="range" min="1" max="100" value={radius} 
                            onChange={(e) => setRadius(parseInt(e.target.value))}
                            className="radius-slider"
                        />
                        {/* NÚT TÌM KIẾM BÁN KÍNH */}
                        <button 
                            onClick={handleScan}
                            className="w-full bg-[#2C3E37] text-white py-2 rounded-lg text-sm font-semibold hover:bg-black transition-all flex items-center justify-center gap-2"
                        >
                            🔍 2. Tìm chi nhánh trong {radius}km
                        </button>
                    </div>
                    {nearest && (
                        <div className="p-4 bg-green-50 border border-green-100 rounded-xl">
                            <span className="text-xs font-bold text-green-600 uppercase tracking-wider">Gần bạn nhất</span>
                            <p className="font-bold text-[#2C3E37]">{nearest.name}</p>
                            <p className="text-sm text-gray-600">Cách khoảng <b>{nearest.dist.toFixed(2)} km</b></p>
                        </div>
                    )}
                    <div className="overflow-y-auto h-[320px] space-y-3 pr-2 custom-scrollbar">
                        {sortedBranches.length > 0 ? sortedBranches.map((b, i) => (
                            <div key={b.id || i} 
                                onClick={() => mapRef.current.flyTo([b.lat, b.lng], 16)}
                                className="p-4 border border-gray-100 rounded-xl hover:shadow-md transition-all cursor-pointer bg-white group">
                                <h4 className="font-bold text-[#2C3E37] group-hover:text-[#7C9885]">{b.name}</h4>
                                <p className="text-xs text-gray-500">{b.address}</p>
                                <div className="flex justify-between items-center mt-2">
                                    {b.dist ? <span className="text-xs font-bold text-[#7C9885]">{b.dist.toFixed(2)} km</span> : <span></span>}
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); showRoute(b); }}
                                        className="text-xs bg-gray-100 px-3 py-1 rounded-lg hover:bg-[#7C9885] hover:text-white transition-colors"
                                    >
                                        Chỉ đường
                                    </button>
                                </div>
                            </div>
                        )) : (
                            <div className="text-center py-10">
                                <p className="text-gray-400">Không tìm thấy chi nhánh nào.</p>
                                <p className="text-xs text-gray-400">Thử tăng bán kính hoặc đổi từ khóa tìm kiếm.</p>
                            </div>
                        )}
                    </div>
                </div>
                <div id="map-container" className="lg:w-2/3"></div>
            </div>
        );
    }
    const root = ReactDOM.createRoot(document.getElementById('branch-finder-root'));
    root.render(<BranchFinder />);
</script>
{% endblock %}
