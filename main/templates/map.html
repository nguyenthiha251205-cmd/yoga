{% extends "base.html" %}
{% load static %}
{% block title %}Hệ thống chi nhánh SoraYoga{% endblock %}
{% block extra_head %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #7C9885; border-radius: 10px; }
    </style>
{% endblock %}
{% block content %}
<div class="container mx-auto py-12 px-4">
    <div class="mb-8 text-center">
        <h1 class="text-4xl font-bold text-[#2C3E37] mb-2">Hệ thống chi nhánh SoraYoga</h1>
        <p class="text-gray-500">Tìm kiếm không gian tập luyện gần bạn nhất</p>
    </div>
    <div id="branch-finder-root"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
    window.allBranches = {{ branches_json|safe }};
</script>
<script type="text/babel" src="{% static 'components/BranchFinder.js' %}"></script>
<script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('branch-finder-root'));
    root.render(<BranchFinder />);
</script>
{% endblock %}
